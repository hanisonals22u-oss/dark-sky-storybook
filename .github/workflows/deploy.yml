name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build -- --base=/dark-sky-storybook/
      - run: |
          if [ -d "dist/client" ]; then
            mv dist/client pages_out
          elif [ -d ".output/public" ]; then
            mv .output/public pages_out
          else
            mv dist pages_out
          fi
          if [ ! -f "pages_out/index.html" ]; then
            cp index.html pages_out/index.html
            ENTRY=$(find pages_out/assets -name "main-*.js" -o -name "index-*.js" | head -n 1 | sed 's|^pages_out/||')
            if [ -n "$ENTRY" ]; then
              sed -i "s|/src/main.tsx|./$ENTRY|g" pages_out/index.html
            fi
          fi
          cp pages_out/index.html pages_out/404.html
          ls -la pages_out
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ./pages_out
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
